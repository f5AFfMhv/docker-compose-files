---
services:
  filebrowser:
    image: gtstef/filebrowser:beta
    container_name: filebrowser
    user: "1000:1000"
    environment:
      - TZ=${time_zone}
    volumes:
      - ${data_dir}:/data
      - ${config_dir}/filebrowserquantum:/home/filebrowser/data
    # ports:
    #   - 9003:80
    restart: unless-stopped

networks:
  default:
    external:
      name: caddy-network
